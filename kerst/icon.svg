<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KERSTDROOM: het gezichtje van Vlok (eigen reekalfje) in een sneeuwbol -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182666"/><stop offset="1" stop-color="#0b1340"/></linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9fc3ff" stop-opacity="0.55"/><stop offset="0.6" stop-color="#3b4a9a" stop-opacity="0.35"/><stop offset="1" stop-color="#8d86cc" stop-opacity="0.6"/></radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b86f1d"/><stop offset="1" stop-color="#6b3d12"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f2a83a"/></linearGradient>
    <clipPath id="globe"><circle cx="256" cy="226" r="168"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- sterretjes achter de bol -->
  <g fill="#fff6d8" opacity="0.9">
    <circle cx="70" cy="90" r="4"/><circle cx="440" cy="70" r="3"/><circle cx="470" cy="150" r="2.5"/><circle cx="40" cy="200" r="2.5"/><circle cx="90" cy="400" r="3"/><circle cx="430" cy="420" r="2.5"/>
  </g>
  <!-- voet -->
  <path d="M150 400 h212 a18 18 0 0 1 18 18 v30 a18 18 0 0 1 -18 18 h-212 a18 18 0 0 1 -18 -18 v-30 a18 18 0 0 1 18 -18z" fill="url(#base)" stroke="#3a2826" stroke-width="8"/>
  <rect x="166" y="386" width="180" height="26" rx="12" fill="#e8465a" stroke="#3a2826" stroke-width="8"/>
  <!-- bol: binnenkant -->
  <g clip-path="url(#globe)">
    <circle cx="256" cy="226" r="168" fill="#3b4a9a"/>
    <path d="M60 330 Q160 250 256 300 T460 310 V420 H60z" fill="#dfe9ff"/>
    <path d="M60 350 Q180 300 256 340 T460 345 V420 H60z" fill="#fbfdff"/>
    <!-- Vlok -->
    <g transform="translate(256 232)">
      <!-- oren -->
      <ellipse cx="-78" cy="-62" rx="30" ry="48" transform="rotate(-28 -78 -62)" fill="#c4844a" stroke="#3a2826" stroke-width="8"/>
      <ellipse cx="78" cy="-62" rx="30" ry="48" transform="rotate(28 78 -62)" fill="#c4844a" stroke="#3a2826" stroke-width="8"/>
      <ellipse cx="-76" cy="-58" rx="14" ry="26" transform="rotate(-28 -76 -58)" fill="#f7d9c4"/>
      <ellipse cx="76" cy="-58" rx="14" ry="26" transform="rotate(28 76 -58)" fill="#f7d9c4"/>
      <!-- kop -->
      <ellipse cx="0" cy="0" rx="92" ry="84" fill="#c4844a" stroke="#3a2826" stroke-width="8"/>
      <!-- lichte snuit -->
      <ellipse cx="0" cy="34" rx="50" ry="36" fill="#f3dcc3"/>
      <!-- witte vlekjes -->
      <g fill="#fff8ec"><circle cx="-56" cy="-30" r="7"/><circle cx="56" cy="-30" r="7"/><circle cx="-40" cy="-56" r="5"/><circle cx="40" cy="-56" r="5"/><circle cx="0" cy="-66" r="6"/></g>
      <!-- blosjes -->
      <ellipse cx="-58" cy="26" rx="16" ry="10" fill="#ff8ad6" opacity="0.55"/><ellipse cx="58" cy="26" rx="16" ry="10" fill="#ff8ad6" opacity="0.55"/>
      <!-- ogen -->
      <ellipse cx="-34" cy="-6" rx="17" ry="20" fill="#2b1a12"/><ellipse cx="34" cy="-6" rx="17" ry="20" fill="#2b1a12"/>
      <circle cx="-28" cy="-13" r="6" fill="#fff"/><circle cx="40" cy="-13" r="6" fill="#fff"/>
      <circle cx="-38" cy="2" r="3" fill="#fff" opacity="0.8"/><circle cx="30" cy="2" r="3" fill="#fff" opacity="0.8"/>
      <!-- neus & mondje -->
      <ellipse cx="0" cy="34" rx="16" ry="11" fill="#f28ca0" stroke="#3a2826" stroke-width="6"/>
      <path d="M0 45 v12 M-14 62 q14 12 28 0" fill="none" stroke="#3a2826" stroke-width="6" stroke-linecap="round"/>
      <!-- kerstmuts -->
      <path d="M-70 -70 Q-10 -150 62 -118 Q30 -128 -2 -96 Q-30 -82 -70 -70z" fill="#e8465a" stroke="#3a2826" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-78 -62 Q-10 -98 66 -78" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
      <circle cx="70" cy="-120" r="16" fill="#fff" stroke="#3a2826" stroke-width="6"/>
    </g>
    <!-- sneeuwvlokjes in de bol -->
    <g fill="#fff" opacity="0.95">
      <circle cx="130" cy="120" r="6"/><circle cx="380" cy="100" r="5"/><circle cx="170" cy="190" r="4"/><circle cx="350" cy="200" r="6"/><circle cx="110" cy="260" r="5"/><circle cx="400" cy="270" r="4"/><circle cx="300" cy="80" r="4"/><circle cx="220" cy="100" r="3"/>
    </g>
  </g>
  <!-- glas -->
  <circle cx="256" cy="226" r="168" fill="url(#glass)" stroke="#5f8fc4" stroke-width="10"/>
  <path d="M130 140 Q160 90 215 78" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round"/>
  <!-- ster bovenop -->
  <path transform="translate(256 54) scale(1.25)" d="M0 -22 L6.5 -7 L22 -6 L10 4.5 L13.5 20 L0 12 L-13.5 20 L-10 4.5 L-22 -6 L-6.5 -7z" fill="url(#gold)" stroke="#3a2826" stroke-width="5" stroke-linejoin="round"/>
</svg>
