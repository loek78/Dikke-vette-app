<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Een vlam in het ronde raampje van een donkere kachel (bij het vuur, Loek & Jacques) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a110b"/><stop offset="1" stop-color="#0b0705"/>
    </linearGradient>
    <radialGradient id="room" cx=".5" cy=".58" r=".6">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity=".55"/><stop offset=".55" stop-color="#e8401c" stop-opacity=".12"/><stop offset="1" stop-color="#0b0705" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iron" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#4a3222"/><stop offset=".6" stop-color="#1d120a"/><stop offset="1" stop-color="#0b0705"/>
    </radialGradient>
    <radialGradient id="glass" cx=".5" cy=".9" r=".9">
      <stop offset="0" stop-color="#ff8a2a"/><stop offset=".35" stop-color="#7a2208"/><stop offset=".75" stop-color="#1a0804"/><stop offset="1" stop-color="#0b0705"/>
    </radialGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8401c"/><stop offset=".45" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5aa9ff" stop-opacity="0"/><stop offset=".5" stop-color="#5aa9ff"/><stop offset="1" stop-color="#9fd3ff"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a22"/><stop offset=".5" stop-color="#8a5a36"/><stop offset="1" stop-color="#3a2416"/>
    </linearGradient>
    <clipPath id="win"><circle cx="256" cy="268" r="150"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#room)"/>
  <!-- gietijzeren ring -->
  <circle cx="256" cy="268" r="178" fill="url(#iron)"/>
  <circle cx="256" cy="268" r="178" fill="none" stroke="#ffc247" stroke-opacity=".28" stroke-width="3"/>
  <circle cx="256" cy="268" r="156" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="10"/>
  <!-- raampje -->
  <circle cx="256" cy="268" r="150" fill="url(#glass)"/>
  <g clip-path="url(#win)">
    <!-- gloed achter de vlam -->
    <ellipse cx="256" cy="330" rx="120" ry="70" fill="#ff6a1a" opacity=".7" filter="url(#soft)"/>
    <!-- vlam -->
    <path d="M256 118c22 54 92 92 92 176a92 92 0 0 1-184 0c0-46 24-74 42-100 6 34 22 50 40 50-10-56 0-92 10-126z" fill="url(#fl)"/>
    <path d="M256 236c14 32 46 50 46 90a46 46 0 0 1-92 0c0-24 14-40 22-58 4 18 12 26 22 26-4-26-4-44 2-58z" fill="url(#core)"/>
    <!-- blauwe vlamtongetjes -->
    <path d="M196 352c4-22 14-34 12-56 10 14 16 30 14 48-4 16-16 22-26 8z" fill="url(#bl)" opacity=".9"/>
    <path d="M318 356c-2-18 6-30 6-48 8 12 14 26 12 42-2 14-12 18-18 6z" fill="url(#bl)" opacity=".8"/>
    <!-- houtblok en gloeiend bed -->
    <rect x="132" y="352" width="248" height="46" rx="20" fill="url(#log)" transform="rotate(-9 256 375)"/>
    <rect x="132" y="352" width="248" height="46" rx="20" fill="none" stroke="#ff6a1a" stroke-opacity=".45" stroke-width="3" transform="rotate(-9 256 375)"/>
    <ellipse cx="256" cy="418" rx="150" ry="40" fill="#ff6a1a" opacity=".55" filter="url(#soft2)"/>
    <g fill="#ffc247" opacity=".9">
      <circle cx="176" cy="182" r="3"/><circle cx="336" cy="156" r="2.5"/><circle cx="302" cy="128" r="2"/><circle cx="212" cy="140" r="2"/>
    </g>
  </g>
  <!-- roostertje onderin -->
  <rect x="176" y="402" width="160" height="6" rx="3" fill="#0b0705" opacity=".85"/>
</svg>
